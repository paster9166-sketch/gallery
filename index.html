<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetix Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0e0e0e; color: #ffffff; font-family: 'Helvetica', sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 1px solid #d4af37; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { background: #1a1a1a; border-radius: 10px; overflow: hidden; border: 0.5px solid #333; }
        .item-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .item-info { padding: 10px; font-size: 12px; }
        .price { color: #d4af37; font-weight: bold; }
        .btn { background: #d4af37; color: #000; border: none; width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="letter-spacing: 2px;">SYNTHETIX</h2>
        <p style="font-size: 10px; color: #888;">SANTIAGO DE SURCO | LIMA</p>
    </div>
    
    <div class="grid">
        <div class="item-card">
            <img src="https://via.placeholder.com/250" class="item-img">
            <div class="item-info">
                <div>ART-001 "Ocean"</div>
                <div class="price">450 PEN</div>
                <button class="btn" onclick="tg.close()">СМОТРЕТЬ</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
    </script>
</body>
</html>
